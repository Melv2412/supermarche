{% extends 'base.html' %}
{% load static %}
{% block title %}Catégories - Liste{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Header avec recherche -->
  <div class="mb-6 animate-slide-down">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-bold gradient-text-violet">Catégories</h1>
        <p class="text-gray-600 mt-1">Gestion des catégories de produits</p>
      </div>
      <button class="btn-primary" onclick="Products.gotoCategoryForm();return false;">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Nouvelle catégorie
      </button>
    </div>
    
    <div class="flex items-center gap-4">
      <div class="flex-1">
        <input id="cat-search" class="input-modern" placeholder="🔍 Rechercher une catégorie...">
      </div>
      <div class="badge-violet" style="padding: 0.75rem 1.5rem;">
        <span id="cat-count" class="font-bold">0</span> catégories
      </div>
    </div>
  </div>

  <!-- Tableau -->
  <div class="card-modern animate-slide-up">
    <table class="table-modern">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="cat-tbody"></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/products.js' %}?v=3"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (typeof Products !== 'undefined' && Products.initCategoryList) {
    Products.initCategoryList();
  } else {
    console.error('Products.initCategoryList not found');
  }
});
</script>
{% endblock %}
