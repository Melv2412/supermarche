{% extends 'base.html' %}
{% load static %}
{% block title %}Catégories - Liste{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label class="form-label small text-muted">Recherche</label>
      <input id="cat-search" class="form-control form-control-sm" placeholder="Nom...">
    </div>
    <a href="#" class="btn btn-primary btn-sm" onclick="Products.gotoCategoryForm();return false;">Nouvelle catégorie</a>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Catégories</strong>
      <span id="cat-count" class="badge text-bg-secondary">0</span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody id="cat-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/products.js' %}?v=2"></script>
<script>Products.initCategoryList();</script>
{% endblock %}
