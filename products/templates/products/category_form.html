{% extends 'base.html' %}
{% load static %}
{% block title %}Catégorie - Formulaire{% endblock %}
{% block content %}
<div class="container py-3">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Nouvelle catégorie</strong>
      <a class="btn btn-sm btn-outline-secondary" href="#" onclick="Products.gotoCategoryList();return false;">Retour à la liste</a>
    </div>
    <div class="card-body">
      <form id="category-form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input id="c-name" type="text" class="form-control" required>
            <div class="invalid-feedback">Nom requis.</div>
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea id="c-desc" class="form-control" rows="2"></textarea>
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button class="btn btn-outline-secondary" type="reset">Réinitialiser</button>
          <button class="btn btn-primary" type="submit">Enregistrer (simulation)</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/products.js' %}?v=2"></script>
<script>Products.initCategoryForm();</script>
{% endblock %}
