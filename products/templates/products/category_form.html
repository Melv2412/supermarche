{% extends 'base.html' %}
{% load static %}
{% block title %}Catégorie - Formulaire{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <div class="mb-6 animate-slide-down">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold gradient-text-violet">Nouvelle catégorie</h1>
        <p class="text-gray-600 mt-1">Créer une nouvelle catégorie de produits</p>
      </div>
      <button class="btn-outline" onclick="Products.gotoCategoryList();return false;">Retour à la liste</button>
    </div>
  </div>

  <div class="card-modern animate-scale-in">
    <div class="p-8">
      <form id="category-form" novalidate>
        {% csrf_token %}
        <div class="space-y-6">
          <div>
            <label for="c-name" class="block text-sm font-medium text-gray-700 mb-2">Nom</label>
            <input id="c-name" type="text" class="input-modern" placeholder="Ex: Produits laitiers" required>
            <div id="name-error" class="hidden text-red-600 text-sm mt-1">Nom requis.</div>
          </div>
          <div>
            <label for="c-desc" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
            <textarea id="c-desc" class="input-modern" rows="3" placeholder="Description de la catégorie..."></textarea>
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button class="btn-outline" type="reset">Réinitialiser</button>
          <button class="btn-success flex items-center gap-2 px-6" type="submit">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span>Enregistrer</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/products.js' %}?v=20251020"></script>
<script>Products.initCategoryForm();</script>
{% endblock %}
