<svg viewBox="0 0 2000 2600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .class-box { fill: #fff; stroke: #db2777; stroke-width: 2; }
      .class-header { fill: #ec4899; }
      .class-name { fill: #fff; font: bold 16px Arial; text-anchor: middle; }
      .attribute { fill: #831843; font: 12px 'Courier New'; }
      .method { fill: #7c3aed; font: 12px 'Courier New'; }
      .relation-line { stroke: #64748b; stroke-width: 2; fill: none; }
      .composition { stroke: #dc2626; stroke-width: 2; fill: none; }
      .aggregation { stroke: #059669; stroke-width: 2; fill: none; }
      .association { stroke: #0891b2; stroke-width: 2; fill: none; }
      .label { fill: #475569; font: 11px Arial; }
      .cardinality { fill: #dc2626; font: bold 10px Arial; }
    </style>
    
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="diamond-full" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
      <path d="M0,6 L6,0 L12,6 L6,12 z" fill="#dc2626" stroke="#dc2626"/>
    </marker>
    <marker id="diamond-empty" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
      <path d="M0,6 L6,0 L12,6 L6,12 z" fill="#fff" stroke="#059669" stroke-width="2"/>
    </marker>
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#db2777;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Titre -->
  <rect x="0" y="0" width="2000" height="80" fill="url(#gradient4)"/>
  <text x="1000" y="35" style="fill:#fff; font:bold 28px Arial; text-anchor:middle;">Diagramme UML 4 : CRM et Fidélisation des Clients</text>
  <text x="1000" y="60" style="fill:#fce7f3; font:14px Arial; text-anchor:middle;">Programme de Fidélité, Points, Récompenses et Application Mobile</text>

  <!-- Classe Client (Haut gauche) -->
  <g id="client">
    <rect class="class-box" x="50" y="120" width="340" height="300"/>
    <rect class="class-header" x="50" y="120" width="340" height="35"/>
    <text class="class-name" x="220" y="142">Client</text>
    <line x1="50" y1="155" x2="390" y2="155" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="60" y="175">- idClient: Integer</text>
    <text class="attribute" x="60" y="190">- nom: String</text>
    <text class="attribute" x="60" y="205">- prenom: String</text>
    <text class="attribute" x="60" y="220">- email: String</text>
    <text class="attribute" x="60" y="235">- telephone: String</text>
    <text class="attribute" x="60" y="250">- dateInscription: DateTime</text>
    <text class="attribute" x="60" y="265">- derniereVisite: DateTime</text>
    <text class="attribute" x="60" y="280">- frequenceAchat: String</text>
    
    <line x1="50" y1="295" x2="390" y2="295" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="60" y="315">+ obtenirHistoriqueAchats(): List</text>
    <text class="method" x="60" y="330">+ calculerValeurVie(): Decimal</text>
    <text class="method" x="60" y="345">+ obtenirSegmentation(): Segmentation</text>
    <text class="method" x="60" y="360">+ envoyerNotification(): void</text>
  </g>

  <!-- Classe CarteFidelite -->
  <g id="cartefidelite">
    <rect class="class-box" x="460" y="120" width="360" height="280"/>
    <rect class="class-header" x="460" y="120" width="360" height="35"/>
    <text class="class-name" x="640" y="142">CarteFidelite</text>
    <line x1="460" y1="155" x2="820" y2="155" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="470" y="175">- idCarte: Integer</text>
    <text class="attribute" x="470" y="190">- numeroCarte: String</text>
    <text class="attribute" x="470" y="205">- qrCode: String</text>
    <text class="attribute" x="470" y="220">- dateActivation: DateTime</text>
    <text class="attribute" x="470" y="235">- niveauFidelite: String</text>
    <text class="attribute" x="470" y="250">- estActive: Boolean</text>
    <text class="attribute" x="470" y="265">- soldePoints: Integer</text>
    
    <line x1="460" y1="280" x2="820" y2="280" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="470" y="300">+ ajouterPoints(montant): void</text>
    <text class="method" x="470" y="315">+ retirerPoints(points): void</text>
    <text class="method" x="470" y="330">+ verifierSolde(): Integer</text>
    <text class="method" x="470" y="345">+ monterNiveau(): void</text>
    <text class="method" x="470" y="360">+ genererQRCode(): String</text>
  </g>

  <!-- Classe PointsFidelite -->
  <g id="pointsfidelite">
    <rect class="class-box" x="890" y="120" width="340" height="260"/>
    <rect class="class-header" x="890" y="120" width="340" height="35"/>
    <text class="class-name" x="1060" y="142">PointsFidelite</text>
    <line x1="890" y1="155" x2="1230" y2="155" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="900" y="175">- idPoints: Integer</text>
    <text class="attribute" x="900" y="190">- dateObtention: DateTime</text>
    <text class="attribute" x="900" y="205">- nombrePoints: Integer</text>
    <text class="attribute" x="900" y="220">- source: String</text>
    <text class="attribute" x="900" y="235">- montantAchat: Decimal</text>
    <text class="attribute" x="900" y="250">- estUtilise: Boolean</text>
    
    <line x1="890" y1="265" x2="1230" y2="265" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="900" y="285">+ calculerPoints(montant): Integer</text>
    <text class="method" x="900" y="300">+ verifierValidite(): Boolean</text>
    <text class="method" x="900" y="315">+ utiliser(): void</text>
  </g>

  <!-- Classe Recompense -->
  <g id="recompense">
    <rect class="class-box" x="1300" y="120" width="360" height="280"/>
    <rect class="class-header" x="1300" y="120" width="360" height="35"/>
    <text class="class-name" x="1480" y="142">Recompense</text>
    <line x1="1300" y1="155" x2="1660" y2="155" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="1310" y="175">- idRecompense: Integer</text>
    <text class="attribute" x="1310" y="190">- nom: String</text>
    <text class="attribute" x="1310" y="205">- typeRecompense: String</text>
    <text class="attribute" x="1310" y="220">- coutEnPoints: Integer</text>
    <text class="attribute" x="1310" y="235">- valeurMonetaire: Decimal</text>
    <text class="attribute" x="1310" y="250">- estDisponible: Boolean</text>
    <text class="attribute" x="1310" y="265">- stockRestant: Integer</text>
    
    <line x1="1300" y1="280" x2="1660" y2="280" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="1310" y="300">+ verifierEligibilite(): Boolean</text>
    <text class="method" x="1310" y="315">+ echanger(carte): void</text>
    <text class="method" x="1310" y="330">+ genererCoupon(): Coupon</text>
  </g>

  <!-- Classe HistoriqueAchat -->
  <g id="historiqueachat">
    <rect class="class-box" x="50" y="480" width="340" height="240"/>
    <rect class="class-header" x="50" y="480" width="340" height="35"/>
    <text class="class-name" x="220" y="502">HistoriqueAchat</text>
    <line x1="50" y1="515" x2="390" y2="515" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="60" y="535">- idHistorique: Integer</text>
    <text class="attribute" x="60" y="550">- dateAchat: DateTime</text>
    <text class="attribute" x="60" y="565">- montantTotal: Decimal</text>
    <text class="attribute" x="60" y="580">- nombreArticles: Integer</text>
    <text class="attribute" x="60" y="595">- categoriePrincipale: String</text>
    <text class="attribute" x="60" y="610">- frequenceAchat: Integer</text>
    
    <line x1="50" y1="625" x2="390" y2="625" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="60" y="645">+ analyserPreferences(): Map</text>
    <text class="method" x="60" y="660">+ detecterTendances(): List</text>
    <text class="method" x="60" y="675">+ calculerFrequence(): Integer</text>
  </g>

  <!-- Classe ArticleAchete -->
  <g id="articleachete">
    <rect class="class-box" x="50" y="780" width="340" height="180"/>
    <rect class="class-header" x="50" y="780" width="340" height="35"/>
    <text class="class-name" x="220" y="802">ArticleAchete</text>
    <line x1="50" y1="815" x2="390" y2="815" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="60" y="835">- idArticleAchete: Integer</text>
    <text class="attribute" x="60" y="850">- quantite: Integer</text>
    <text class="attribute" x="60" y="865">- prixUnitaire: Decimal</text>
    <text class="attribute" x="60" y="880">- categorie: String</text>
    <text class="attribute" x="60" y="895">- marque: String</text>
    
    <line x1="50" y1="910" x2="390" y2="910" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="60" y="930">+ enregistrerAchat(): void</text>
  </g>

  <!-- Classe OffrePersonnalisee -->
  <g id="offrepersonnalisee">
    <rect class="class-box" x="460" y="480" width="360" height="280"/>
    <rect class="class-header" x="460" y="480" width="360" height="35"/>
    <text class="class-name" x="640" y="502">OffrePersonnalisee</text>
    <line x1="460" y1="515" x2="820" y2="515" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="470" y="535">- idOffre: Integer</text>
    <text class="attribute" x="470" y="550">- titre: String</text>
    <text class="attribute" x="470" y="565">- description: String</text>
    <text class="attribute" x="470" y="580">- typeOffre: String</text>
    <text class="attribute" x="470" y="595">- valeurRemise: Decimal</text>
    <text class="attribute" x="470" y="610">- dateExpiration: DateTime</text>
    <text class="attribute" x="470" y="625">- codePromo: String</text>
    <text class="attribute" x="470" y="640">- cibleSegment: String</text>
    
    <line x1="460" y1="655" x2="820" y2="655" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="470" y="675">+ genererOffrePersonnalisee(): void</text>
    <text class="method" x="470" y="690">+ envoyerNotification(): void</text>
    <text class="method" x="470" y="705">+ verifierValidite(): Boolean</text>
  </g>

  <!-- Classe Notification -->
  <g id="notification">
    <rect class="class-box" x="890" y="480" width="340" height="240"/>
    <rect class="class-header" x="890" y="480" width="340" height="35"/>
    <text class="class-name" x="1060" y="502">Notification</text>
    <line x1="890" y1="515" x2="1230" y2="515" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="900" y="535">- idNotification: Integer</text>
    <text class="attribute" x="900" y="550">- titre: String</text>
    <text class="attribute" x="900" y="565">- message: String</text>
    <text class="attribute" x="900" y="580">- typeNotification: String</text>
    <text class="attribute" x="900" y="595">- dateEnvoi: DateTime</text>
    <text class="attribute" x="900" y="610">- estLue: Boolean</text>
    
    <line x1="890" y1="625" x2="1230" y2="625" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="900" y="645">+ envoyer(): void</text>
    <text class="method" x="900" y="660">+ marquerCommeLue(): void</text>
    <text class="method" x="900" y="675">+ planifier(date): void</text>
  </g>

  <!-- Classe Segmentation -->
  <g id="segmentation">
    <rect class="class-box" x="1300" y="480" width="360" height="240"/>
    <rect class="class-header" x="1300" y="480" width="360" height="35"/>
    <text class="class-name" x="1480" y="502">Segmentation</text>
    <line x1="1300" y1="515" x2="1660" y2="515" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="1310" y="535">- idSegment: Integer</text>
    <text class="attribute" x="1310" y="550">- nomSegment: String</text>
    <text class="attribute" x="1310" y="565">- description: String</text>
    <text class="attribute" x="1310" y="580">- criteres: String</text>
    <text class="attribute" x="1310" y="595">- seuilMontantMin: Decimal</text>
    <text class="attribute" x="1310" y="610">- seuilFrequenceMin: Integer</text>
    
    <line x1="1300" y1="625" x2="1660" y2="625" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="1310" y="645">+ classerClient(client): Boolean</text>
    <text class="method" x="1310" y="660">+ obtenirClients(): List</text>
    <text class="method" x="1310" y="675">+ genererCampagne(): Campagne</text>
  </g>

  <!-- Classe AvantageNiveau -->
  <g id="avantageniveau">
    <rect class="class-box" x="890" y="800" width="340" height="220"/>
    <rect class="class-header" x="890" y="800" width="340" height="35"/>
    <text class="class-name" x="1060" y="822">AvantageNiveau</text>
    <line x1="890" y1="835" x2="1230" y2="835" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="900" y="855">- idAvantage: Integer</text>
    <text class="attribute" x="900" y="870">- niveauConcerne: String</text>
    <text class="attribute" x="900" y="885">- nom: String</text>
    <text class="attribute" x="900" y="900">- typeAvantage: String</text>
    <text class="attribute" x="900" y="915">- valeur: Decimal</text>
    <text class="attribute" x="900" y="930">- multiplicateurPoints: Decimal</text>
    
    <line x1="890" y1="945" x2="1230" y2="945" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="900" y="965">+ appliquerAvantage(): void</text>
    <text class="method" x="900" y="980">+ verifierEligibilite(): Boolean</text>
  </g>

  <!-- Classe ApplicationMobile -->
  <g id="applicationmobile">
    <rect class="class-box" x="460" y="820" width="360" height="260"/>
    <rect class="class-header" x="460" y="820" width="360" height="35"/>
    <text class="class-name" x="640" y="842">ApplicationMobile</text>
    <line x1="460" y1="855" x2="820" y2="855" stroke="#db2777" stroke-width="1"/>
    
    <text class="attribute" x="470" y="875">- idApp: Integer</text>
    <text class="attribute" x="470" y="890">- versionApp: String</text>
    <text class="attribute" x="470" y="905">- plateforme: String</text>
    <text class="attribute" x="470" y="920">- tokenPush: String</text>
    <text class="attribute" x="470" y="935">- derniereConnexion: DateTime</text>
    
    <line x1="460" y1="950" x2="820" y2="950" stroke="#db2777" stroke-width="1"/>
    
    <text class="method" x="470" y="970">+ afficherSoldePoints(): Integer</text>
    <text class="method" x="470" y="985">+ genererQRCode(): String</text>
    <text class="method" x="470" y="1000">+ afficherOffres(): List</text>
    <text class="method" x="470" y="1015">+ scannerQRCaisse(): void</text>
    <text class="method" x="470" y="1030">+ consulterHistorique(): List</text>
  </g>

  <!-- RELATIONS -->

  <!-- Client -> CarteFidelite (Composition) -->
  <path class="composition" d="M 390 270 L 460 270" marker-start="url(#diamond-full)"/>
  <text class="cardinality" x="395" y="265">1</text>
  <text class="cardinality" x="445" y="265">1</text>
  <text class="label" x="405" y="260">possède</text>

  <!-- CarteFidelite -> PointsFidelite (Aggregation) -->
  <path class="aggregation" d="M 820 250 L 890 250" marker-start="url(#diamond-empty)"/>
  <text class="cardinality" x="825" y="245">1</text>
  <text class="cardinality" x="875" y="245">*</text>
  <text class="label" x="835" y="240">accumule</text>

  <!-- PointsFidelite -> Recompense (Association) -->
  <path class="association" d="M 1230 250 L 1300 250" marker-end="url(#arrow)"/>
  <text class="cardinality" x="1235" y="245">*</text>
  <text class="cardinality" x="1285" y="245">0..1</text>
  <text class="label" x="1245" y="240">échange contre</text>

  <!-- Client -> HistoriqueAchat (Association) -->
  <path class="association" d="M 220 420 L 220 480" marker-end="url(#arrow)"/>
  <text class="cardinality" x="225" y="430">1</text>
  <text class="cardinality" x="225" y="475">*</text>
  <text class="label" x="230" y="455">a historique</text>

  <!-- HistoriqueAchat -> ArticleAchete (Composition) -->
  <path class="composition" d="M 220 720 L 220 780" marker-start="url(#diamond-full)"/>
  <text class="cardinality" x="225" y="730">1</text>
  <text class="cardinality" x="225" y="775">1..*</text>
  <text class="label" x="230" y="750">contient</text>

  <!-- HistoriqueAchat -> OffrePersonnalisee (Association) -->
  <path class="association" d="M 390 600 L 460 600" marker-end="url(#arrow)"/>
  <text class="cardinality" x="395" y="595">*</text>
  <text class="cardinality" x="445" y="595">*</text>
  <text class="label" x="405" y="590">génère</text>

  <!-- OffrePersonnalisee -> Notification (Association) -->
  <path class="association" d="M 820 600 L 890 600" marker-end="url(#arrow)"/>
  <text class="cardinality" x="825" y="595">1</text>
  <text class="cardinality" x="875" y="595">1..*</text>
  <text class="label" x="835" y="590">envoie via</text>

  <!-- Client -> Notification (Association) -->
  <path class="association" d="M 390 340 Q 640