{% extends 'base.html' %}
{% load static %}
{% block title %}Fournisseur - Détail{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Header -->
  <div class="mb-6 animate-slide-down">
    <div class="flex justify-between items-center">
      <h1 class="text-3xl font-bold gradient-text-violet">📦 <span id="sup-name">Fournisseur</span></h1>
      <button class="btn-secondary" onclick="Suppliers.gotoSupplierList();return false;">← Retour</button>
    </div>
  </div>

  <!-- Informations fournisseur -->
  <div class="card-modern mb-6 animate-scale-in">
    <div class="card-header-modern">
      <h2 class="text-xl font-semibold text-white">Informations</h2>
    </div>
    <div class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <div class="text-sm text-gray-500 mb-1">Email</div>
          <div id="sup-email" class="font-medium text-gray-900">-</div>
        </div>
        <div>
          <div class="text-sm text-gray-500 mb-1">Téléphone</div>
          <div id="sup-phone" class="font-medium text-gray-900">-</div>
        </div>
        <div>
          <div class="text-sm text-gray-500 mb-1">Catégories</div>
          <div id="sup-categories" class="font-medium text-gray-900">-</div>
        </div>
        <div class="md:col-span-3">
          <div class="text-sm text-gray-500 mb-1">Adresse</div>
          <div id="sup-address" class="font-medium text-gray-900">-</div>
        </div>
        <div class="md:col-span-3">
          <div class="text-sm text-gray-500 mb-1">Notes</div>
          <div id="sup-notes" class="text-gray-700">-</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Commandes récentes -->
  <div class="card-modern animate-slide-up">
    <div class="card-header-modern">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold text-white">📋 Commandes récentes</h2>
        <button class="btn-white" onclick="Suppliers.gotoOrderForm();return false;">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Nouvelle commande
        </button>
      </div>
    </div>
    <div class="overflow-hidden">
      <table class="table-modern">
        <thead>
          <tr>
            <th>Commande</th>
            <th>Date</th>
            <th>Statut</th>
            <th class="text-end">Montant</th>
          </tr>
        </thead>
        <tbody id="sup-orders"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/suppliers.js' %}?v=2"></script>
<script>Suppliers.initSupplierDetail();</script>
{% endblock %}
