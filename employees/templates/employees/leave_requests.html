{% extends 'base.html' %}
{% load static %}
{% block title %}RH - Demandes de congés{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Header -->
  <div class="mb-6 animate-slide-down">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl font-bold gradient-text-violet">🏖️ Demandes de Congés</h1>
        <p class="text-gray-600 mt-1">Gestion des absences et congés du personnel</p>
      </div>
      <button class="btn-primary" onclick="showNewLeaveModal()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Nouvelle demande
      </button>
    </div>
    
    <!-- Filtres -->
    <div class="flex flex-wrap gap-4">
      <div class="flex-1 min-w-64">
        <input id="lv-search" class="input-modern" placeholder="🔍 Rechercher un employé...">
      </div>
      <select id="lv-status" class="input-modern" style="min-width: 200px;">
        <option value="">Tous les statuts</option>
        <option value="pending">En attente</option>
        <option value="approved">Approuvé</option>
        <option value="rejected">Refusé</option>
      </select>
      <div class="badge-violet" style="padding: 0.75rem 1.5rem;">
        <span id="lv-count" class="font-bold">0</span> demandes
      </div>
    </div>
  </div>

  <!-- Tableau -->
  <div class="card-modern animate-slide-up">
    <table class="table-modern">
      <thead>
        <tr>
          <th>Employé</th>
          <th>Période</th>
          <th>Durée</th>
          <th>Type</th>
          <th class="text-center">Statut</th>
          <th>Motif</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody id="lv-tbody"></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/employees.js' %}?v=3"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  Employees.initLeaveRequests();
});
</script>
{% endblock %}
