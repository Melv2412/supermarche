{% extends 'base.html' %}
{% load static %}
{% block title %}RH - Demandes de congés{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label class="form-label small text-muted">Recherche</label>
      <input id="lv-search" class="form-control form-control-sm" placeholder="Nom, type...">
    </div>
    <select id="lv-status" class="form-select form-select-sm" style="max-width:200px">
      <option value="">Tous statuts</option>
      <option value="pending">En attente</option>
      <option value="approved">Approuvé</option>
      <option value="rejected">Refusé</option>
    </select>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Demandes</strong>
      <span id="lv-count" class="badge text-bg-secondary">0</span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead>
          <tr>
            <th>Employé</th>
            <th>Période</th>
            <th>Type</th>
            <th>Statut</th>
            <th>Commentaire</th>
          </tr>
        </thead>
        <tbody id="lv-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/employees.js' %}?v=2"></script>
<script>Employees.initLeaveRequests();</script>
{% endblock %}
