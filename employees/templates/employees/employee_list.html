{% extends 'base.html' %}
{% load static %}
{% block title %}Employés - Liste{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label class="form-label small text-muted">Recherche</label>
      <input id="emp-search" class="form-control form-control-sm" placeholder="Nom, email, poste...">
    </div>
    <select id="emp-role" class="form-select form-select-sm" style="max-width:200px">
      <option value="">Tous les rôles</option>
      <option>Caissier</option>
      <option>Rayon</option>
      <option>Logistique</option>
      <option>Manager</option>
    </select>
    <a href="#" class="btn btn-primary btn-sm" onclick="Employees.gotoForm();return false;">Nouvel employé</a>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Employés</strong>
      <span id="emp-count" class="badge text-bg-secondary">0</span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Statut</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="emp-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/employees.js' %}?v=2"></script>
<script>Employees.initList();</script>
{% endblock %}
