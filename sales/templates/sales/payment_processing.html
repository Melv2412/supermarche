{% extends 'base.html' %}
{% block title %}Paiement{% endblock %}
{% block content %}
<div class="container py-3">
  <div class="card">
    <div class="card-header"><strong>Traitement du paiement</strong></div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label">Montant à encaisser</label>
          <input id="pay-amount" type="text" class="form-control" value="0,00 FCFA" disabled>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Moyen de paiement</label>
          <select id="pay-method" class="form-select">
            <option>Carte bancaire</option>
            <option>Espèces</option>
            <option>Mobile</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Remarques</label>
          <textarea id="pay-notes" class="form-control" rows="2" placeholder="Notes internes (facultatif)"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-3 gap-2">
        <a class="btn btn-outline-secondary" href="#" onclick="history.back();return false;">Annuler</a>
        <button class="btn btn-success" onclick="alert('Paiement simulé. Reçu généré.');">Confirmer le paiement</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
