{% extends 'base.html' %}
{% load static %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header text-center"><strong>Créer un compte</strong></div>
      <div class="card-body">
        <form id="form-register" novalidate>
          <div class="mb-3">
            <label for="fullname" class="form-label">Nom complet</label>
            <input type="text" class="form-control" id="fullname" required>
            <div class="invalid-feedback">Nom requis.</div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="nom@exemple.com" required>
            <div class="invalid-feedback">Email invalide.</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" minlength="6" required>
            <div class="invalid-feedback">6 caractères minimum.</div>
          </div>
          <div class="mb-3">
            <label for="password2" class="form-label">Confirmer le mot de passe</label>
            <input type="password" class="form-control" id="password2" minlength="6" required>
            <div class="invalid-feedback">Les mots de passe doivent correspondre.</div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a class="small" href="#" onclick="return AppSec.goto('login');">Déjà un compte ? Se connecter</a>
            <button class="btn btn-primary" type="submit">Créer le compte</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/security.js' %}?v=2"></script>
<script>AppSec.initRegister();</script>
{% endblock %}
