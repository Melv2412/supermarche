{% extends 'base.html' %}
{% load static %}
{% block title %}Stocks - Dashboard{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Gestion des Stocks</h1>
    <p class="text-gray-600 mt-1">Inventaire et alertes de stock</p>
  </div>

  <!-- Filtres -->
  <div class="card-modern mb-6">
    <div class="p-6">
      <div class="flex flex-wrap gap-4 items-end">
        <div class="flex-1 min-w-64">
          <label class="block text-sm font-medium text-gray-700 mb-2">Recherche</label>
          <div class="relative">
            <input id="filter-search" class="input-modern pl-10" placeholder="Nom du produit...">
            <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
        </div>
        <div class="min-w-48">
          <label class="block text-sm font-medium text-gray-700 mb-2">Catégorie</label>
          <select id="filter-category" class="input-modern">
            <option value="">Toutes les catégories</option>
          </select>
        </div>
        <div class="min-w-32">
          <label class="block text-sm font-medium text-gray-700 mb-2">Seuil min.</label>
          <input id="filter-threshold" type="number" class="input-modern" value="10" min="0">
        </div>
        <button id="filter-reset" class="btn-secondary">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          Réinitialiser
        </button>
      </div>
    </div>
  </div>

  <!-- KPI Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div class="kpi-card animate-slide-up">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-600">Stock faible</p>
          <p id="kpi-low" class="text-3xl font-bold text-orange-600 mt-2">0</p>
        </div>
        <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
          </svg>
        </div>
      </div>
    </div>

    <div class="kpi-card animate-slide-up" style="animation-delay: 0.1s">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-600">Ruptures</p>
          <p id="kpi-out" class="text-3xl font-bold text-red-600 mt-2">0</p>
        </div>
        <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Tableau d'inventaire -->
  <div class="card-modern">
    <div class="card-header-modern">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold text-gray-800 flex items-center">
          <svg class="w-6 h-6 mr-2 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
          </svg>
          Inventaire
        </h2>
        <span id="count" class="badge-modern">0</span>
      </div>
    </div>
    <div class="overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Produit</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Catégorie</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Stock</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Seuil</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
            </tr>
          </thead>
          <tbody id="stock-tbody" class="bg-white divide-y divide-gray-200">
            <!-- Les stocks seront ajoutés ici par JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/inventory.js' %}?v=2"></script>
{% endblock %}
