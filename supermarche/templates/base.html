{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Supermarché{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'images/empty_bag.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5">
  {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 font-sans">
  <div class="min-h-screen flex flex-col">
    {% include 'header.html' %}
    <div class="flex flex-1">
      <aside class="w-64 sidebar-modern min-h-screen">
        {% include 'sidebar.html' %}
      </aside>
      <main class="flex-1 p-6 animate-fade-in">
        {% block content %}{% endblock %}
      </main>
    </div>
    {% include 'footer.html' %}
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="{% static 'js/main.js' %}?v=2"></script>
  <script>
    // Force cache refresh pour ne pas avoir les legesr erreur 
    if (window.location.search.indexOf('cache=clear') === -1) {
      window.location.href = window.location.href + (window.location.search ? '&' : '?') + 'cache=clear';
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
