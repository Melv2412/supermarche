{% extends 'base.html' %}
{% load static %}
{% block title %}Fournisseurs - Liste{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label class="form-label small text-muted">Recherche</label>
      <input id="sup-search" class="form-control form-control-sm" placeholder="Nom, email, téléphone...">
    </div>
    <a href="#" class="btn btn-primary btn-sm" onclick="Suppliers.gotoSupplierForm();return false;">Nouveau fournisseur</a>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Fournisseurs</strong>
      <span id="sup-count" class="badge text-bg-secondary">0</span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Catégories</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sup-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/suppliers.js' %}?v=2"></script>
<script>Suppliers.initSupplierList();</script>
{% endblock %}
