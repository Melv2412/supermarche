{% extends 'base.html' %}
{% load static %}
{% block title %}Suivi des livraisons{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label class="form-label small text-muted">Recherche</label>
      <input id="trk-search" class="form-control form-control-sm" placeholder="Commande, fournisseur, transporteur...">
    </div>
    <select id="trk-status" class="form-select form-select-sm" style="max-width:200px">
      <option value="">Tous statuts</option>
      <option value="in_transit">En transit</option>
      <option value="delivered">Livré</option>
      <option value="delayed">Retardé</option>
    </select>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Livraisons</strong>
      <span id="trk-count" class="badge text-bg-secondary">0</span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead>
          <tr>
            <th>Commande</th>
            <th>Fournisseur</th>
            <th>Transporteur</th>
            <th>Statut</th>
            <th>ETA</th>
          </tr>
        </thead>
        <tbody id="trk-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/suppliers.js' %}?v=2"></script>
<script>Suppliers.initTracking();</script>
{% endblock %}
