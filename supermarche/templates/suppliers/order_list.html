{% extends 'base.html' %}
{% load static %}
{% block title %}Commandes - Liste{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label class="form-label small text-muted">Recherche</label>
      <input id="ord-search" class="form-control form-control-sm" placeholder="Commande, fournisseur...">
    </div>
    <select id="ord-status" class="form-select form-select-sm" style="max-width:200px">
      <option value="">Tous statuts</option>
      <option value="pending">En attente</option>
      <option value="confirmed">Confirmée</option>
      <option value="shipped">Expédiée</option>
      <option value="delivered">Livrée</option>
      <option value="cancelled">Annulée</option>
    </select>
    <a href="#" class="btn btn-primary btn-sm" onclick="Suppliers.gotoOrderForm();return false;">Nouvelle commande</a>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Commandes</strong>
      <span id="ord-count" class="badge text-bg-secondary">0</span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead>
          <tr>
            <th>#</th>
            <th>Fournisseur</th>
            <th>Date</th>
            <th>Statut</th>
            <th class="text-end">Montant</th>
          </tr>
        </thead>
        <tbody id="ord-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/suppliers.js' %}?v=2"></script>
<script>Suppliers.initOrderList();</script>
{% endblock %}
