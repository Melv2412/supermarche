{% extends 'base.html' %}
{% load static %}
{% block title %}Commande - Détail{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Commande <span id="ord-id">#</span></strong>
      <a href="#" class="btn btn-sm btn-outline-secondary" onclick="Suppliers.gotoOrderList();return false;">Retour</a>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3"><div class="text-muted small">Fournisseur</div><div id="ord-supplier">-</div></div>
        <div class="col-md-3"><div class="text-muted small">Date</div><div id="ord-date">-</div></div>
        <div class="col-md-3"><div class="text-muted small">Statut</div><div id="ord-status">-</div></div>
        <div class="col-md-3"><div class="text-muted small">Montant</div><div id="ord-amount">-</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><strong>Lignes de commande</strong></div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead><tr><th>Produit</th><th class="text-end">Qté</th><th class="text-end">PU</th><th class="text-end">Total</th></tr></thead>
        <tbody id="ord-lines"></tbody>
        <tfoot>
          <tr><th colspan="3" class="text-end">Total</th><th class="text-end" id="ord-total">0,00 FCFA</th></tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/suppliers.js' %}?v=2"></script>
<script>Suppliers.initOrderDetail();</script>
{% endblock %}
