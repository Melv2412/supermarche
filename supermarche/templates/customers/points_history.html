{% extends 'base.html' %}
{% load static %}
{% block title %}Clients - Historique des points{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label class="form-label small text-muted">Recherche client</label>
      <input id="hist-search" class="form-control form-control-sm" placeholder="Nom, email...">
    </div>
    <select id="hist-type" class="form-select form-select-sm" style="max-width:180px">
      <option value="">Tous les mouvements</option>
      <option value="earn">Gain</option>
      <option value="redeem">Utilisation</option>
      <option value="adjust">Ajustement</option>
    </select>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Historique des points</strong>
      <span id="hist-count" class="badge text-bg-secondary">0</span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead>
          <tr>
            <th>Date</th>
            <th>Client</th>
            <th>Email</th>
            <th class="text-end">Points</th>
            <th>Type</th>
            <th>Commentaire</th>
          </tr>
        </thead>
        <tbody id="hist-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/customers.js' %}?v=2"></script>
<script>Customers.initHistory();</script>
{% endblock %}
