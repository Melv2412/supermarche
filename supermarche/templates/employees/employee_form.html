{% extends 'base.html' %}
{% load static %}
{% block title %}Employé - Formulaire{% endblock %}
{% block content %}
<div class="container py-3">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Nouvel employé</strong>
      <a class="btn btn-sm btn-outline-secondary" href="#" onclick="Employees.gotoList();return false;">Retour à la liste</a>
    </div>
    <div class="card-body">
      <form id="emp-form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nom complet</label>
            <input id="f-name" type="text" class="form-control" required>
            <div class="invalid-feedback">Nom requis.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input id="f-email" type="email" class="form-control" required>
            <div class="invalid-feedback">Email invalide.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Rôle</label>
            <select id="f-role" class="form-select" required>
              <option value="">Choisir...</option>
              <option>Caissier</option>
              <option>Rayon</option>
              <option>Logistique</option>
              <option>Manager</option>
            </select>
            <div class="invalid-feedback">Rôle requis.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Téléphone</label>
            <input id="f-phone" type="text" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Statut</label>
            <select id="f-status" class="form-select">
              <option>Actif</option>
              <option>Inactif</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea id="f-notes" class="form-control" rows="2"></textarea>
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button class="btn btn-outline-secondary" type="reset">Réinitialiser</button>
          <button class="btn btn-primary" type="submit">Enregistrer (simulation)</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/employees.js' %}?v=2"></script>
<script>Employees.initForm();</script>
{% endblock %}
