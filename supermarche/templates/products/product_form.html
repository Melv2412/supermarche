{% extends 'base.html' %}
{% load static %}
{% block title %}Produit - Formulaire{% endblock %}
{% block content %}
<div class="container py-3">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Nouveau produit</strong>
      <a class="btn btn-sm btn-outline-secondary" href="#" onclick="Products.gotoList();return false;">Retour à la liste</a>
    </div>
    <div class="card-body">
      <form id="product-form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input id="f-name" type="text" class="form-control" required>
            <div class="invalid-feedback">Nom requis.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Catégorie</label>
            <select id="f-category" class="form-select" required>
              <option value="">Choisir...</option>
            </select>
            <div class="invalid-feedback">Catégorie requise.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Code-barres</label>
            <input id="f-barcode" type="text" class="form-control" placeholder="EAN/UPC">
          </div>
          <div class="col-md-3">
            <label class="form-label">Prix (FCFA)</label>
            <input id="f-price" type="number" step="0.01" min="0" class="form-control" required>
            <div class="invalid-feedback">Prix invalide.</div>
          </div>
          <div class="col-md-3">
            <label class="form-label">TVA (%)</label>
            <input id="f-vat" type="number" step="0.1" min="0" class="form-control" value="20">
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea id="f-desc" class="form-control" rows="2" placeholder="Courte description...\n(front uniquement, aucune persistance)"></textarea>
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button class="btn btn-outline-secondary" type="reset">Réinitialiser</button>
          <button class="btn btn-primary" type="submit">Prévisualiser</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-header"><strong>Prévisualisation</strong></div>
    <div class="card-body">
      <div id="preview" class="text-muted">Aucune donnée à afficher.</div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/products.js' %}?v=2"></script>
<script>Products.initForm();</script>
{% endblock %}
