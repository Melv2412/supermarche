{% extends 'base.html' %}
{% load static %}
{% block title %}Réinitialiser le mot de passe{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header text-center"><strong>Réinitialisation du mot de passe</strong></div>
      <div class="card-body">
        <form id="form-reset" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="nom@exemple.com" required>
            <div class="invalid-feedback">Email invalide.</div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a class="small" href="#" onclick="return AppSec.goto('login');">Retour connexion</a>
            <button class="btn btn-primary" type="submit">Envoyer le lien</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/security.js' %}?v=2"></script>
<script>AppSec.initReset();</script>
{% endblock %}
