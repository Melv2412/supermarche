{% extends 'base.html' %}
{% load static %}
{% block title %}Gestion des Clients{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
      <div class="text-muted small">Clients inscrits</div>
      <div id="kpi-customers" class="h4 m-0">0</div>
    </div></div></div>
    <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
      <div class="text-muted small">Points totaux</div>
      <div id="kpi-points" class="h4 m-0">0</div>
    </div></div></div>
    <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
      <div class="text-muted small">Points moyens</div>
      <div id="kpi-avg" class="h4 m-0">0</div>
    </div></div></div>
    <div class="col-6 col-lg-3"><div class="card"><div class="card-body">
      <div class="text-muted small">Clients actifs</div>
      <div id="kpi-active" class="h4 m-0">0</div>
    </div></div></div>
  </div>

  <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
    <div class="flex-grow-1">
      <label class="form-label small text-muted">Recherche</label>
      <input id="cust-search" class="form-control form-control-sm" placeholder="Nom, email...">
    </div>
    <a href="#" class="btn btn-outline-secondary btn-sm" onclick="Customers.gotoHistory();return false;">Historique des points</a>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Clients</strong>
      <span id="cust-count" class="badge text-bg-secondary">0</span>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th class="text-end">Points</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="cust-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/customers.js' %}?v=2"></script>
<script>Customers.initManagement();</script>
{% endblock %}
