{% extends 'base.html' %}
{% load static %}
{% block title %}Boutique en Ligne{% endblock %}
{% block content %}
<div class="flex h-screen overflow-hidden">
  <!-- Liste des produits (gauche) -->
  <div class="flex-1 overflow-y-auto p-6 bg-gray-50">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">🛒 Boutique en Ligne</h1>
      
      <!-- Recherche -->
      <div class="mb-4">
        <input type="text" id="shop-search" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="🔍 Rechercher un produit..." onkeyup="Shop.applyFilters()">
      </div>
      
      <!-- Filtres -->
      <div class="grid grid-cols-2 gap-3 mb-4">
        <select id="shop-category" class="px-4 py-2 border border-gray-300 rounded-lg" onchange="Shop.applyFilters()">
          <option value="">Toutes catégories</option>
        </select>
        <select id="shop-sort" class="px-4 py-2 border border-gray-300 rounded-lg" onchange="Shop.applyFilters()">
          <option value="name">Trier par nom</option>
          <option value="price-asc">Prix croissant</option>
          <option value="price-desc">Prix décroissant</option>
        </select>
      </div>
    </div>

    <!-- Grille produits -->
    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Produits chargés dynamiquement -->
    </div>
  </div>

  <!-- Panier (droite) - Toujours visible -->
  <div class="w-96 bg-white border-l border-gray-200 flex flex-col">
    <!-- Header panier -->
    <div class="p-6 border-b border-gray-200 bg-green-600 text-white">
      <h2 class="text-xl font-bold">🛒 Mon Panier</h2>
      <p class="text-sm text-green-100 mt-1"><span id="cart-count">0</span> article(s)</p>
    </div>

    <!-- Items panier -->
    <div class="flex-1 overflow-y-auto p-4">
      <div id="cart-items">
        <div class="text-center text-gray-400 py-12">
          <div class="text-5xl mb-3">🛒</div>
          <p>Votre panier est vide</p>
        </div>
      </div>
    </div>

    <!-- Total et paiement -->
    <div class="border-t border-gray-200 p-6 bg-gray-50">
      <div class="space-y-2 mb-4">
        <div class="flex justify-between text-gray-600">
          <span>Sous-total</span>
          <span id="cart-subtotal">0 FCFA</span>
        </div>
        <div class="flex justify-between text-xl font-bold text-gray-800">
          <span>Total</span>
          <span id="cart-total" class="text-green-600">0 FCFA</span>
        </div>
      </div>
      <button id="btn-checkout" class="w-full bg-red-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-red-700 shadow-xl border-b-4 border-red-800 active:border-b-0 active:mt-1 transition-all disabled:bg-gray-300 disabled:border-gray-400 disabled:cursor-not-allowed disabled:transform-none" onclick="Shop.proceedToCheckout()" disabled>
        💰 Enregistrer le paiement
      </button>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/shop.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof Shop !== 'undefined') {
        Shop.init();
    } else {
        console.error('Shop module not loaded');
    }
});
</script>
{% endblock %}
