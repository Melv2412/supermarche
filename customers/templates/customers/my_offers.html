{% extends "base.html" %}

{% block title %}Mes Offres Spéciales{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center mb-8">
            <span class="text-3xl mr-2">🎁</span>
            <h1 class="text-3xl font-bold text-gray-800">Mes Offres Spéciales</h1>
        </div>

        <!-- Liste des promotions -->
        <div id="promotions-list">
            <!-- Les promotions seront chargées ici par JavaScript -->
            <div class="text-center py-8">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500 mx-auto"></div>
                <p class="text-gray-500 mt-2">Chargement des promotions...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        Customers.initPromotionsView();
    });
</script>
{% endblock %}
