<svg viewBox="0 0 1600 2400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .class-box { fill: white; stroke: #2563eb; stroke-width: 2; }
      .class-header { fill: #3b82f6; }
      .class-name { fill: white; font-size: 18px; font-weight: bold; font-family: Arial, sans-serif; }
      .attribute { fill: #1e293b; font-size: 12px; font-family: 'Courier New', monospace; }
      .method { fill: #1e293b; font-size: 12px; font-family: 'Courier New', monospace; }
      .section-title { fill: #1e293b; font-size: 13px; font-weight: bold; font-family: Arial, sans-serif; }
      .relation-line { stroke: #6366f1; stroke-width: 2; fill: none; }
      .arrow { fill: #6366f1; }
      .composition-diamond { fill: #6366f1; }
      .aggregation-diamond { fill: white; stroke: #6366f1; stroke-width: 2; }
      .cardinality { fill: #4338ca; font-size: 11px; font-weight: bold; font-family: Arial, sans-serif; }
      .title-text { fill: #1e40af; font-size: 32px; font-weight: bold; font-family: Arial, sans-serif; }
      .subtitle-text { fill: #475569; font-size: 16px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <!-- Titre principal -->
  <rect x="0" y="0" width="1600" height="100" fill="url(#gradient-title)"/>
  <defs>
    <linearGradient id="gradient-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="800" y="45" text-anchor="middle" class="title-text" fill="white">Diagramme UML 5 : Reporting et Sécurité (Transversal)</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle-text" fill="white">Sécurité, RBAC, Dashboards, KPI et Audit</text>

  <!-- Classe Utilisateur -->
  <g id="utilisateur">
    <rect x="50" y="130" width="300" height="380" class="class-box"/>
    <rect x="50" y="130" width="300" height="40" class="class-header"/>
    <text x="200" y="155" text-anchor="middle" class="class-name">Utilisateur</text>
    
    <text x="60" y="185" class="section-title">Attributs:</text>
    <text x="60" y="205" class="attribute">- idUtilisateur: Integer</text>
    <text x="60" y="220" class="attribute">- username: String</text>
    <text x="60" y="235" class="attribute">- passwordHash: String</text>
    <text x="60" y="250" class="attribute">- email: String</text>
    <text x="60" y="265" class="attribute">- nom: String</text>
    <text x="60" y="280" class="attribute">- prenom: String</text>
    <text x="60" y="295" class="attribute">- estActif: Boolean</text>
    <text x="60" y="310" class="attribute">- tentativesEchouees: Integer</text>
    <text x="60" y="325" class="attribute">- dateDerniereConnexion: DateTime</text>
    
    <line x1="50" y1="340" x2="350" y2="340" stroke="#2563eb" stroke-width="1"/>
    <text x="60" y="360" class="section-title">Méthodes:</text>
    <text x="60" y="380" class="method">+ authentifier(password): Boolean</text>
    <text x="60" y="395" class="method">+ changerMotDePasse(): void</text>
    <text x="60" y="410" class="method">+ verifierPermissions(action): Boolean</text>
    <text x="60" y="425" class="method">+ bloquerCompte(): void</text>
    <text x="60" y="440" class="method">+ obtenirRoles(): List&lt;Role&gt;</text>
  </g>

  <!-- Classe Role -->
  <g id="role">
    <rect x="420" y="130" width="280" height="320" class="class-box"/>
    <rect x="420" y="130" width="280" height="40" class="class-header"/>
    <text x="560" y="155" text-anchor="middle" class="class-name">Role</text>
    
    <text x="430" y="185" class="section-title">Attributs:</text>
    <text x="430" y="205" class="attribute">- idRole: Integer</text>
    <text x="430" y="220" class="attribute">- nomRole: String</text>
    <text x="430" y="235" class="attribute">- description: String</text>
    <text x="430" y="250" class="attribute">- niveauAcces: Integer</text>
    <text x="430" y="265" class="attribute">- dateCreation: DateTime</text>
    <text x="430" y="280" class="attribute">- estActif: Boolean</text>
    
    <line x1="420" y1="295" x2="700" y2="295" stroke="#2563eb" stroke-width="1"/>
    <text x="430" y="315" class="section-title">Méthodes:</text>
    <text x="430" y="335" class="method">+ ajouterPermission(p): void</text>
    <text x="430" y="350" class="method">+ retirerPermission(p): void</text>
    <text x="430" y="365" class="method">+ verifierPermission(action): Boolean</text>
    <text x="430" y="380" class="method">+ obtenirUtilisateurs(): List</text>
  </g>

  <!-- Classe Permission -->
  <g id="permission">
    <rect x="770" y="130" width="280" height="320" class="class-box"/>
    <rect x="770" y="130" width="280" height="40" class="class-header"/>
    <text x="910" y="155" text-anchor="middle" class="class-name">Permission</text>
    
    <text x="780" y="185" class="section-title">Attributs:</text>
    <text x="780" y="205" class="attribute">- idPermission: Integer</text>
    <text x="780" y="220" class="attribute">- nomPermission: String</text>
    <text x="780" y="235" class="attribute">- codePermission: String</text>
    <text x="780" y="250" class="attribute">- module: String</text>
    <text x="780" y="265" class="attribute">- typeAction: String</text>
    <text x="780" y="280" class="attribute">- estCritique: Boolean</text>
    
    <line x1="770" y1="295" x2="1050" y2="295" stroke="#2563eb" stroke-width="1"/>
    <text x="780" y="315" class="section-title">Méthodes:</text>
    <text x="780" y="335" class="method">+ verifierAcces(user): Boolean</text>
    <text x="780" y="350" class="method">+ loggerAcces(user, action): void</text>
  </g>

  <!-- Classe Session -->
  <g id="session">
    <rect x="50" y="560" width="300" height="310" class="class-box"/>
    <rect x="50" y="560" width="300" height="40" class="class-header"/>
    <text x="200" y="585" text-anchor="middle" class="class-name">Session</text>
    
    <text x="60" y="615" class="section-title">Attributs:</text>
    <text x="60" y="635" class="attribute">- idSession: Integer</text>
    <text x="60" y="650" class="attribute">- tokenSession: String</text>
    <text x="60" y="665" class="attribute">- dateDebut: DateTime</text>
    <text x="60" y="680" class="attribute">- dateFin: DateTime</text>
    <text x="60" y="695" class="attribute">- adresseIP: String</text>
    <text x="60" y="710" class="attribute">- estActive: Boolean</text>
    
    <line x1="50" y1="725" x2="350" y2="725" stroke="#2563eb" stroke-width="1"/>
    <text x="60" y="745" class="section-title">Méthodes:</text>
    <text x="60" y="765" class="method">+ creerSession(user): String</text>
    <text x="60" y="780" class="method">+ validerToken(token): Boolean</text>
    <text x="60" y="795" class="method">+ terminerSession(): void</text>
    <text x="60" y="810" class="method">+ verifierExpiration(): Boolean</text>
  </g>

  <!-- Classe Log -->
  <g id="log">
    <rect x="420" y="560" width="280" height="360" class="class-box"/>
    <rect x="420" y="560" width="280" height="40" class="class-header"/>
    <text x="560" y="585" text-anchor="middle" class="class-name">Log</text>
    
    <text x="430" y="615" class="section-title">Attributs:</text>
    <text x="430" y="635" class="attribute">- idLog: Integer</text>
    <text x="430" y="650" class="attribute">- dateHeure: DateTime</text>
    <text x="430" y="665" class="attribute">- typeLog: String</text>
    <text x="430" y="680" class="attribute">- niveau: String</text>
    <text x="430" y="695" class="attribute">- message: String</text>
    <text x="430" y="710" class="attribute">- module: String</text>
    <text x="430" y="725" class="attribute">- action: String</text>
    <text x="430" y="740" class="attribute">- adresseIP: String</text>
    
    <line x1="420" y1="755" x2="700" y2="755" stroke="#2563eb" stroke-width="1"/>
    <text x="430" y="775" class="section-title">Méthodes:</text>
    <text x="430" y="795" class="method">+ enregistrerLog(): void</text>
    <text x="430" y="810" class="method">+ rechercher(criteres): List</text>
    <text x="430" y="825" class="method">+ analyserSecurity(): List</text>
    <text x="430" y="840" class="method">+ genererRapportAudit(): Report</text>
  </g>

  <!-- Classe Dashboard -->
  <g id="dashboard">
    <rect x="770" y="560" width="280" height="340" class="class-box"/>
    <rect x="770" y="560" width="280" height="40" class="class-header"/>
    <text x="910" y="585" text-anchor="middle" class="class-name">Dashboard</text>
    
    <text x="780" y="615" class="section-title">Attributs:</text>
    <text x="780" y="635" class="attribute">- idDashboard: Integer</text>
    <text x="780" y="650" class="attribute">- nomDashboard: String</text>
    <text x="780" y="665" class="attribute">- typeDashboard: String</text>
    <text x="780" y="680" class="attribute">- roleAcces: String</text>
    <text x="780" y="695" class="attribute">- derniereMiseAJour: DateTime</text>
    <text x="780" y="710" class="attribute">- frequenceRefresh: Integer</text>
    
    <line x1="770" y1="725" x2="1050" y2="725" stroke="#2563eb" stroke-width="1"/>
    <text x="780" y="745" class="section-title">Méthodes:</text>
    <text x="780" y="765" class="method">+ chargerKPIs(): List&lt;KPI&gt;</text>
    <text x="780" y="780" class="method">+ actualiserDonnees(): void</text>
    <text x="780" y="795" class="method">+ exporter(format): File</text>
    <text x="780" y="810" class="method">+ personnaliser(widget): void</text>
    <text x="780" y="825" class="method">+ verifierAcces(user): Boolean</text>
  </g>

  <!-- Classe KPI -->
  <g id="kpi">
    <rect x="1120" y="560" width="280" height="380" class="class-box"/>
    <rect x="1120" y="560" width="280" height="40" class="class-header"/>
    <text x="1260" y="585" text-anchor="middle" class="class-name">KPI</text>
    
    <text x="1130" y="615" class="section-title">Attributs:</text>
    <text x="1130" y="635" class="attribute">- idKPI: Integer</text>
    <text x="1130" y="650" class="attribute">- nomKPI: String</text>
    <text x="1130" y="665" class="attribute">- codeKPI: String</text>
    <text x="1130" y="680" class="attribute">- categorie: String</text>
    <text x="1130" y="695" class="attribute">- valeurActuelle: Decimal</text>
    <text x="1130" y="710" class="attribute">- valeurCible: Decimal</text>
    <text x="1130" y="725" class="attribute">- seuilAlerte: Decimal</text>
    <text x="1130" y="740" class="attribute">- tendance: String</text>
    
    <line x1="1120" y1="755" x2="1400" y2="755" stroke="#2563eb" stroke-width="1"/>
    <text x="1130" y="775" class="section-title">Méthodes:</text>
    <text x="1130" y="795" class="method">+ calculerValeur(): Decimal</text>
    <text x="1130" y="810" class="method">+ comparerObjectif(): Decimal</text>
    <text x="1130" y="825" class="method">+ detecterAnomalie(): Boolean</text>
    <text x="1130" y="840" class="method">+ genererAlerte(): void</text>
    <text x="1130" y="855" class="method">+ obtenirHistorique(p): List</text>
  </g>

  <!-- Classe Report -->
  <g id="report">
    <rect x="1120" y="130" width="320" height="380" class="class-box"/>
    <rect x="1120" y="130" width="320" height="40" class="class-header"/>
    <text x="1280" y="155" text-anchor="middle" class="class-name">Report</text>
    
    <text x="1130" y="185" class="section-title">Attributs:</text>
    <text x="1130" y="205" class="attribute">- idReport: Integer</text>
    <text x="1130" y="220" class="attribute">- nomReport: String</text>
    <text x="1130" y="235" class="attribute">- typeReport: String</text>
    <text x="1130" y="250" class="attribute">- dateGeneration: DateTime</text>
    <text x="1130" y="265" class="attribute">- periodeDebut: Date</text>
    <text x="1130" y="280" class="attribute">- periodeFin: Date</text>
    <text x="1130" y="295" class="attribute">- formatFichier: String</text>
    <text x="1130" y="310" class="attribute">- estProgramme: Boolean</text>
    <text x="1130" y="325" class="attribute">- frequenceGeneration: String</text>
    
    <line x1="1120" y1="340" x2="1440" y2="340" stroke="#2563eb" stroke-width="1"/>
    <text x="1130" y="360" class="section-title">Méthodes:</text>
    <text x="1130" y="380" class="method">+ genererReport(): void</text>
    <text x="1130" y="395" class="method">+ envoyerParEmail(dest): void</text>
    <text x="1130" y="410" class="method">+ telecharger(): File</text>
    <text x="1130" y="425" class="method">+ programmer(freq, heure): void</text>
    <text x="1130" y="440" class="method">+ analyserDonnees(): Map</text>
  </g>

  <!-- Relations -->
  
  <!-- Utilisateur -> Role (Association) -->
  <path d="M 350 290 L 420 290" class="relation-line"/>
  <polygon points="415,285 420,290 415,295" class="arrow"/>
  <text x="370" y="280" class="cardinality">1..*</text>
  <text x="390" y="280" class="cardinality">possède</text>

  <!-- Role -> Permission (Association) -->
  <path d="M 700 290 L 770 290" class="relation-line"/>
  <polygon points="765,285 770,290 765,295" class="arrow"/>
  <text x="715" y="280" class="cardinality">1..*</text>
  <text x="720" y="305" class="cardinality">a</text>

  <!-- Utilisateur -> Session (Composition) -->
  <path d="M 200 510 L 200 560" class="relation-line"/>
  <polygon points="195,555 200,560 205,555" class="arrow"/>
  <polygon points="200,510 195,520 200,530 205,520" class="composition-diamond"/>
  <text x="210" y="535" class="cardinality">1..*</text>
  <text x="150" y="535" class="cardinality">crée</text>

  <!-- Utilisateur -> Log (Association) -->
  <path d="M 300 510 Q 360 535 420 700" class="relation-line"/>
  <polygon points="415,695 420,700 420,690" class="arrow"/>
  <text x="340" y="590" class="cardinality">1..*</text>
  <text x="310" y="550" class="cardinality">génère</text>

  <!-- Session -> Log (Association) -->
  <path d="M 350 700 L 420 700" class="relation-line"/>
  <polygon points="415,695 420,700 415,705" class="arrow"/>
  <text x="370" y="690" class="cardinality">0..*</text>

  <!-- Utilisateur -> Dashboard (Association) -->
  <path d="M 350 350 Q 550 480 770 700" class="relation-line"/>
  <polygon points="765,698 770,700 767,692" class="arrow"/>
  <text x="520" y="500" class="cardinality">consulte</text>
  <text x="600" y="600" class="cardinality">*</text>

  <!-- Dashboard -> KPI (Composition) -->
  <path d="M 1050 750 L 1120 750" class="relation-line"/>
  <polygon points="1115,745 1120,750 1115,755" class="arrow"/>
  <polygon points="1050,750 1055,745 1065,750 1055,755" class="composition-diamond"/>
  <text x="1070" y="740" class="cardinality">1..*</text>
  <text x="1060" y="770" class="cardinality">contient</text>

  <!-- Dashboard -> Report (Association) -->
  <path d="M 1050 600 Q 1085 400 1120 350" class="relation-line"/>
  <polygon points="1116,353 1120,350 1118,358" class="arrow"/>
  <text x="1060" y="470" class="cardinality">génère</text>
  <text x="1090" y="400" class="cardinality">*</text>

  <!-- KPI -> Report (Association) -->
  <path d="M 1260 560 L 1280 510" class="relation-line"/>
  <polygon points="1278,515 1280,510 1283,515" class="arrow"/>
  <text x="1270" y="530" class="cardinality">utilisé dans</text>
  <text x="1290" y="530" class="cardinality">*</text>

  <!-- Utilisateur -> Report (Association) -->
  <path d="M 350 200 Q 735 165 1120 200" class="relation-line"/>
  <polygon points="1115,198 1120,200 1115,203" class="arrow"/>
  <text x="680" y="155" class="cardinality">génère</text>
  <text x="900" y="190" class="cardinality">*</text>

  <!-- Log -> Report (Association) -->
  <path d="M 700 600 Q 910 450 1120 350" class="relation-line"/>
  <polygon points="1116,353 1120,350 1118,358" class="arrow"/>
  <text x="850" y="470" class="cardinality">0..*</text>
  <text x="900" y="450" class="cardinality">trace pour audit</text>

  <!-- Role -> Dashboard (Association) -->
  <path d="M 700 450 Q 735 505 770 620" class="relation-line"/>
  <polygon points="767,616 770,620 763,619" class="arrow"/>
  <text x="720" y="530" class="cardinality">restreint</text>

  <!-- Légende -->
  <rect x="50" y="1000" width="1400" height="350" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <text x="750" y="1035" text-anchor="middle" style="fill:#1e40af; font-size:24px; font-weight:bold; font-family:Arial;">Légende et Informations</text>
  
  <!-- Relations expliquées -->
  <text x="70" y="1070" style="fill:#1e293b; font-size:14px; font-weight:bold;">Relations principales:</text>
  <line x1="70" y1="1090" x2="170" y2="1090" class="relation-line"/>
  <polygon points="165,1085 170,1090 165,1095" class="arrow"/>
  <text x="180" y="1095" style="fill:#475569; font-size:12px;">Association simple</text>
  
  <line x1="70" y1="1120" x2="170" y2="1120" class="relation-line"/>
  <polygon points="70,1120 75,1115 85,1120 75,1125" class="composition-diamond"/>
  <text x="180" y="1125" style="fill:#475569; font-size:12px;">Composition (existence dépendante)</text>
  
  <!-- Rôles RBAC -->
  <text x="70" y="1165" style="fill:#1e293b; font-size:14px; font-weight:bold;">Rôles RBAC (Role-Based Access Control):</text>
  <text x="70" y="1190" style="fill:#475569; font-size:12px;">• Admin: Accès complet tous modules + gestion utilisateurs/sécurité</text>
  <text x="70" y="1210" style="fill:#475569; font-size:12px;">• Manager: Dashboards globaux, reports, gestion stocks/ventes/CRM</text>
  <text x="70" y="1230" style="fill:#475569; font-size:12px;">• StockManager: Gestion stocks complète, dashboards stocks uniquement</text>
  <text x="70" y="1250" style="fill:#475569; font-size:12px;">• Caissier: Opérations ventes, consultation stocks/clients en lecture</text>
  <text x="70" y="1270" style="fill:#475569; font-size:12px;">• RH: Gestion employés, planning, congés, performances, dashboard RH</text>
  
  <!-- KPI exemples -->
  <text x="750" y="1165" style="fill:#1e293b; font-size:14px; font-weight:bold;">Exemples de KPI temps réel:</text>
  <text x="750" y="1190" style="fill:#475569; font-size:12px;">📊 Ventes: CA jour, panier moyen, transactions/heure</text>
  <text x="750" y="1210" style="fill:#475569; font-size:12px;">📦 Stocks: Taux rotation, produits en rupture, valeur stock</text>
  <text x="750" y="1230" style="fill:#475569; font-size:12px;">👥 RH: Taux absentéisme, productivité, heures travaillées</text>
  <text x="750" y="1250" style="fill:#475569; font-size:12px;">❤️ Clients: Taux fidélisation, satisfaction, fréquence achats</text>
  <text x="750" y="1270" style="fill:#475569; font-size:12px;">💰 Finance: Marge brute, coûts opérationnels, ROI promotions</text>
  <text x="750" y="1290" style="fill:#475569; font-size:12px;">🔒 Sécurité: Tentatives échouées, incidents, comptes bloqués</text>
  
  <!-- Sécurité -->
  <text x="70" y="1305" style="fill:#1e293b; font-size:14px; font-weight:bold;">Fonctionnalités de sécurité:</text>
  <text x="70" y="1330" style="fill:#475569; font-size:12px;">🔐 Authentification JWT avec expiration configurable + blocage après 3 échecs</text>
  
  <!-- Footer -->
  <rect x="0" y="1380" width="1600" height="60" fill="url(#gradient-footer)"/>
  <defs>
    <linearGradient id="gradient-footer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="800" y="1410" text-anchor="middle" style="fill:white; font-size:16px; font-weight:bold;">Projet AGL - L3 SIGL 2025-2026 | Dr. KOPOIN N'Diffon Charlemagne</text>
  <text x="800" y="1430" text-anchor="middle" style="fill:white; font-size:13px;">8 Classes | 90+ Attributs | 40+ Méthodes | Module Transversal Sécurité &amp; Reporting</text>
</svg>